# Only ruff is configured here. The project is not packaged; dependencies are in requirements.in and requirements.txt.

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Real errors and likely bugs: pycodestyle errors and warnings, pyflakes, and flake8-bugbear.
# Left off on purpose: line length (long lines are normal here: evaluation cases and the explanations beside the rules),
# import sorting, and the modernising rules, which would rewrite hundreds of lines without changing what the code does.
select = ["E4", "E7", "E9", "F", "W", "B"]
ignore = [
    # `zip()` without `strict=`: a few calls pair a list with itself shifted by one (data/changes.py), so the lengths differ on purpose.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# A fixture imported from another test file and then taken as a test parameter reads as a redefinition to pyflakes.
"tests/**" = ["F811"]
