name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for a database that exists only for this run. Nothing here is a real secret.
      POSTGRES_USER: stockmarket
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: stockmarket
      DATABASE_URL: postgresql://stockmarket:ci-only-password@127.0.0.1:5432/stockmarket
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # The same compose file as local development: the backup tests run pg_dump inside the container named stockmarket-db.
      - name: Start the database
        run: docker compose up -d --wait

      - name: Install the pinned packages
        run: pip install -r requirements.txt

      - name: Create the tables
        run: python db/migrate.py

      # No Ollama and no downloaded models: the tests use fake models and fake embedders for everything the AI layer calls.
      - name: Run the tests
        run: python -m pytest -q

  web:
    name: Web app checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
